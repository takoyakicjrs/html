<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站点骨架 · 白</title>
<link rel="stylesheet" href="components/option-wheel.css">
<link rel="stylesheet" href="components/staggered-menu.css">
<link rel="stylesheet" href="libs/locomotive-scroll.css">
<style>
  :root {
    /* 顶部悬挂带的厚度：轮子转 90° 后，这条带子就是它的裁剪框 */
    --band: 220px;
    --band-top: 0px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; }

  /* ---------- 文渊黑体（基于思源黑体，SIL OFL 1.1，免费商用） ---------- */
  /* 子集化：GB2312 一级字 3755 + 站点用字 + ASCII，两档共约 1.07MB */
  @font-face {
    font-family: "WenYuan Sans SC";
    src: url("fonts/WenYuanSansSC-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "WenYuan Sans SC";
    src: url("fonts/WenYuanSansSC-Bold.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  body {
    margin: 0;
    background: #fff;
    color: #111;
    font-family: "WenYuan Sans SC", "MS PGothic", "Microsoft YaHei", sans-serif;
  }
  .sm-logo { visibility: hidden; }

  /* ---------- 主页：钉住的一屏，滚过就淡出（先空着） ---------- */
  .home {
    position: fixed; inset: 0; z-index: 3;
    background: #fff;
    will-change: opacity, transform;
  }
  .home .hint {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 5px; color: #c2c2c2; user-select: none;
  }
  .home .hint::before {
    content: ''; display: block; width: 1px; height: 32px;
    background: #ddd; margin: 0 auto 10px;
  }

  /* ---------- character：横向轨道（钉住，滚轮驱动） ---------- */
  .stage { position: fixed; inset: 0; overflow: hidden; z-index: 2; }
  /* 装饰层整块不吃鼠标：它们会盖在条条上面（#fgLayer 在 DOM 里排在 #track 之后），
     透明的盒子照样参与命中判定，不加这行点条条完全没反应 */
  .layer { position: absolute; top: 0; left: 0; height: 100%; will-change: transform; pointer-events: none; }

  .slat { position: absolute; overflow: hidden; background: #efefef; will-change: transform; }
  .slat > i {
    position: absolute; top: 0; left: -75%; width: 250%; height: 100%;
    background-size: cover; background-position: center;
    will-change: transform;
  }

  .bg-word {
    position: absolute; top: 50%;
    font-size: 11vh; line-height: 1; letter-spacing: .03em;
    color: #f2f2f2; white-space: nowrap; user-select: none;
    font-weight: 700;
    will-change: transform;
  }

  .label { position: absolute; top: 0; height: 100%; will-change: transform; }
  .label .box { position: absolute; left: 0; top: 50%; transform: translateY(-50%); white-space: nowrap; }
  .label .rule { width: 44px; height: 1px; background: #111; margin-bottom: 14px; }
  .label .idx { font-size: 10px; letter-spacing: 4px; color: #b0b0b0; }
  .label .name { margin-top: 8px; font-size: 21px; letter-spacing: .02em; color: #111; font-weight: 700; }

  /* ---------- 顶部悬挂的轮子（常驻区块指示器） ---------- */
  .wheel-hang {
    position: fixed;
    left: 0;
    top: var(--band-top);
    width: var(--band);
    height: 100vmax;
    transform-origin: 0 0;
    transform: translate(0, var(--band)) rotate(-90deg);
    z-index: 20;
    /* 这条 220px 带子横在屏幕顶上，会盖住高条条的上端 1/4。
       带子本身不接收鼠标（空的带状区域放行给下面的条条），
       只把轮子上真正的可点项放回来 —— 点项仍然能跳栏目。 */
    pointer-events: none;
  }
  #wheel .option-wheel__item { pointer-events: auto; }

  /* ---------- 点条条 → 变纯色 → 两段式展开成全屏角色面板 ---------- */
  .slat { cursor: pointer; pointer-events: auto; }
  .charpanel {
    /* z-index 30：压在顶部轮子（20）之上、右上菜单（40）之下。
       展开时靠这一条把轮子盖住，轮子那些可点项也就吃不到面板上的点击了。 */
    position: fixed; z-index: 30; overflow: hidden;
    will-change: left, top, width, height;
  }
  .charpanel[hidden] { display: none; }
  .cp-portrait {
    position: absolute; left: 0; top: 0; width: 50%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .cp-portrait img { display: block; width: auto; height: auto; max-width: 100%; max-height: 73%; }
  .cp-info {
    position: absolute; left: 60%; top: 50%; width: 32%;
    transform: translateY(-50%);
    color: var(--cp-ink, #111);
    pointer-events: none;
  }
  .cp-info > * { opacity: 0; }
  .cp-rule { width: 44px; height: 1px; background: currentColor; }
  .cp-no { margin-top: 14px; font-size: 10px; letter-spacing: 4px; color: var(--cp-dim, #888); }
  .cp-name { margin-top: 10px; font-size: 30px; line-height: 1.2; letter-spacing: .02em; }
  .cp-desc { margin: 22px 0 0; font-size: 13px; line-height: 2.1; letter-spacing: .02em;
             color: var(--cp-dim, #888); white-space: pre-line; }
</style>
</head>
<body>

<div class="home" id="home">
  <div class="hint">SCROLL</div>
</div>

<div class="stage">
  <div class="layer" id="bgLayer"></div>
  <div class="layer" id="track"></div>
  <div class="layer" id="fgLayer"></div>
</div>

<div class="wheel-hang" id="wheelHang">
  <div id="wheel" style="position:absolute; inset:0;"></div>
</div>

<div id="menu"></div>

<div class="charpanel" id="charpanel" hidden>
  <div class="cp-portrait" id="cpPortrait"><img id="cpImg" alt=""></div>
  <div class="cp-info" id="cpInfo">
    <div class="cp-rule"></div>
    <div class="cp-no" id="cpNo"></div>
    <div class="cp-name" id="cpName"></div>
    <p class="cp-desc" id="cpDesc"></p>
  </div>
</div>

<script src="libs/gsap.min.js"></script>
<!-- Locomotive Scroll v5：内核是 Lenis，UMD 版靠 window.lenis 拿依赖，所以顺序不能反 -->
<script src="libs/lenis.min.js"></script>
<script>window.lenis = window.Lenis;</script>

  var SP_MAX = 9;                             // 单根最大散开 px（原来 18，按你要求减半；?sp=6 / ?sp=12 换档对比）
  var SP_V   = 0.8;                           // 滚动速度(px/ms) 到「满散开」的换算：越小越容易散开（0.8 ≈ 800px/s 就满）
  var SP_K   = [-0.8, -0.45, 0.4, -0.05, 0.4];   // 每根散开的方向与幅度（负号 = 反向）
  var SP_SK  = [0.10, 0.16, 0.22, 0.13, 0.19];// 每根跟上的快慢（越小越慢，尾巴越长）

  var m = location.search.match(/[?&]r=([\d.]+)/);
  if (m) RATIO = parseFloat(m[1]);

    // 10 被剔除者的遗言

    { no: '02', name: '名字占位', portrait: '', desc: '这里是一两行假文，先占着位置。\n以后换成真的角色介绍。' },
    { no: '03', name: '名字占位', portrait: '', desc: '这里是一两行假文，先占着位置。\n以后换成真的角色介绍。' },
    { no: '04', name: '名字占位', portrait: '', desc: '这里是一两行假文，先占着位置。\n以后换成真的角色介绍。' },

    { no: '02', name: '名字占位', portrait: '', desc: '这里是一两行假文，先占着位置。\n以后换成真的角色介绍。' },
    { no: '03', name: '名字占位', portrait: '', desc: '这里是一两行假文，先占着位置。\n以后换成真的角色介绍。' }
  ];
  var CP_H  = 0.73;        // 立绘高 = 0.73 × 视口高
  var CP_CX = 0.25;        // 立绘水平中心（左侧那块占 0 ~ 2×CP_CX，图在其中居中）
  var CP_TX = 0.60;        // 文字左端
  var CP_TW = 0.32;        // 文字列宽
  var CP_PW = 0.33;        // 立绘最大宽（横构图的占位图别铺满半屏，四周留白才像「纯色底上站着人」）
  var CP_T1 = 0.45, CP_T2 = 0.35, CP_T3 = 0.35, CP_OV = 0.25;  // 展开：纵向 / 横·原地对称张开 / 内容淡入 / 内容错开
  var CP_C1 = 0.15, CP_C2 = 0.35, CP_C3 = 0.25;
  var cpm;
  if ((cpm = location.search.match(/[?&]ph=([\d.]+)/))) CP_H  = parseFloat(cpm[1]) / 100;
  if ((cpm = location.search.match(/[?&]pc=([\d.]+)/))) CP_CX = parseFloat(cpm[1]) / 100;
  if ((cpm = location.search.match(/[?&]pt=([\d.]+)/))) CP_TX = parseFloat(cpm[1]) / 100;
  if ((cpm = location.search.match(/[?&]pw=([\d.]+)/))) CP_TW = parseFloat(cpm[1]) / 100;
  if ((cpm = location.search.match(/[?&]pi=([\d.]+)/))) CP_PW = parseFloat(cpm[1]) / 100;

  // ================= 栏目 =================
  // imgs 里一格 = 一根条：写图片路径就有图，写 '' 就是「先空着」（留 .slat 的灰底），等你给图再填。
  // noColor: true = 这一栏先不上色（不参与配色轮转，条条不盖色、点开后底色用白），等清单来了再配。
  // colors  = 给「第 n 根」单独指定展开色（位置对齐 imgs，没写的往 5 色轮转里落）。
  var BLOCKS = [
    { idx: '01', name: '红紫法典',              imgs: ['images/1.png', ''], colors: ['#274FE3'] },   // 第 1 根 = 1.png；展开色取图里那个蓝
    { idx: '02', name: '苍苍计划',              imgs: ['', ''] },
    { idx: '03', name: '一去不复返之夜',        imgs: ['', '', '', ''] },

  var trackEl = document.getElementById('track');

  var lastIdx = -1, syncing = false;
  var spVal = [], spTarget = 0, spLastY = null, spTickT = 0, spMoveT = 0, spRAF = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  // 平滑限幅：越靠边越慢，但不会像 clamp 那样彻底“停住”
  function soft(d, k, max) { return max * Math.tanh(d * k / max); }

  function build() {
    vw = window.innerWidth;
    vh = window.innerHeight;

    H     = vh * H_R;
    W     = H / RATIO;
    GAP   = W * GAP_R;
    PITCH = W + GAP;
    TOPA  = vh * TOP_A_R;
    TOPB  = vh * TOP_B_R;
    MAXD  = W * 0.75;

    BLOCK_W   = vw * BLOCK_R;
    BLOCK_GAP = vw * GAPB_R;
    TAIL      = (vw - BLOCK_W) / 2;
    TRACK_W   = (BLOCKS.length - 1) * BLOCK_GAP + BLOCK_W + TAIL;
    TRAVEL    = TRACK_W;                       // 滚到底 = 轨道刚好走完

    // 总滚动 = 主页一屏(vh) + 横向行程(TRAVEL)，所以文档高度要多出两屏
    document.body.style.height = (2 * vh + TRAVEL) + 'px';

    trackEl.innerHTML = ''; bgEl.innerHTML = ''; fgEl.innerHTML = '';
    trackEl.style.width = bgEl.style.width = fgEl.style.width = TRACK_W + 'px';
    slats = []; bgWords = []; labels = [];

    BLOCKS.forEach(function (b, bi) {
      var x0 = bi * BLOCK_GAP;

      // 背景大字（很淡，只做纵深）——放在条条那一侧，避开左边的文字
      var bx = x0 + vw * 0.45;
      var w = document.createElement('div');
      w.className = 'bg-word';
      w.textContent = b.name;
      w.style.left = bx + 'px';
      bgEl.appendChild(w);
      bgWords.push({ el: w, x: bx });

      // 左边的文字
      var lb = document.createElement('div');
      lb.className = 'label';
      lb.style.left = (x0 + vw * LABEL_X) + 'px';
      lb.innerHTML = '<div class="box">' +
        '<div class="rule"></div>' +
        '<div class="idx">' + b.idx + '</div>' +
        '<div class="name">' + b.name + '</div></div>';
      fgEl.appendChild(lb);
      labels.push({ el: lb, x: x0 + vw * LABEL_X });

      // 右边的条条
      b.imgs.forEach(function (src, ci) {
        var x = x0 + vw * SLAT_X + ci * PITCH;
        var s = document.createElement('div');
        s.className = 'slat';
        s.style.left = x + 'px';
        s.style.top = (ci % 2 ? TOPB : TOPA) + 'px';
        s.style.width = W + 'px';
        s.style.height = H + 'px';
        var im = document.createElement('i');
        if (src) {                                 // '' = 这根条先空着（留 .slat 的灰底）
          im.style.backgroundImage = 'url("' + src + '")';
          im.style.backgroundPosition = (30 + ci * 20) + '% center';
        }
        s.appendChild(im);
        trackEl.appendChild(s);
        var gi = slats.length;                                  // 展平后的下标，点这根就展开它
        s.addEventListener('click', function () { openPanel(gi); });
        slats.push({
          el: s, img: im, src: src, x: x,
          color: (b.colors && b.colors[ci]) || null, // 单根指定展开色（没写就落 5 色轮转）
          noColor: !!b.noColor,                      // 这一栏先不上色（不参与配色轮转）
          k:   K_IMG[ci % K_IMG.length],                     // 条内图的视差系数
          spk: SP_K[slats.length % SP_K.length],             // 呼吸：散开方向/幅度
          ssk: SP_SK[slats.length % SP_SK.length]            // 呼吸：跟上目标的快慢
        });
      });
    });

    spVal = slats.map(function () { return 0; });
    spTarget = 0; spLastY = null;

    cpGeometry();
    layout();
  }

  function layout(sy) {
    // 滚动值优先用 Locomotive(Lenis) 给的平滑值，没有就退回浏览器原生 scrollY
    var y = (typeof sy === 'number' && isFinite(sy)) ? sy : window.scrollY;
    var T = clamp(y - vh, 0, TRAVEL);
    var base = vw - T;

    trackEl.style.transform = 'translate3d(' + base + 'px,0,0)';
    bgEl.style.transform    = 'translate3d(' + base + 'px,0,0)';
    fgEl.style.transform    = 'translate3d(' + base + 'px,0,0)';

    var mid = vw / 2;
    var i;
    for (i = 0; i < slats.length; i++) {
      var s = slats[i];
      var ds = (s.x + base + W / 2) - mid;
      s.img.style.transform = 'translate3d(' + soft(ds, s.k, MAXD).toFixed(2) + 'px,0,0)';
    }
    for (i = 0; i < labels.length; i++) {
      var l = labels[i];
      l.el.style.transform = 'translate3d(' + soft((l.x + base) - mid, K_LABEL, 34).toFixed(2) + 'px,0,0)';
    }
    for (i = 0; i < bgWords.length; i++) {
      var b = bgWords[i];
      var db = (b.x + base) - mid;
      b.el.style.transform = 'translate(-50%,-50%) translate3d(' + soft(db, K_BG, 40).toFixed(2) + 'px,0,0)';
      // 离画面中心太远就淡掉，免得视口边缘留半截淡字
      b.el.style.opacity = clamp(1 - (Math.abs(db) - vw * 0.25) / (vw * 0.20), 0, 1).toFixed(3);
    }

    // 主页淡出
    var p = clamp((y - vh * 0.55) / (vh * 0.45), 0, 1);
    homeEl.style.opacity = String(1 - p);
    homeEl.style.transform = 'translate3d(0,' + (-y * 0.10).toFixed(2) + 'px,0)';
    homeEl.style.pointerEvents = p > 0.4 ? 'none' : 'auto';

    // 顶部轮子 = 区块指示器：谁离视口中心最近，就选中谁
    var idx = 0;
    if (y >= vh * 0.9) {
      idx = 1;
      for (var bi = 1; bi < BLOCKS.length; bi++) {
        if (T > (blockCenterT(bi) + blockCenterT(bi + 1)) / 2) idx = bi + 1;
      }
    }
    if (idx !== lastIdx) {
      lastIdx = idx;
      if (wheel) { syncing = true; wheel.select(idx); syncing = false; }
    }

    startSpread();
  }

  // 第 i 个栏目块（i 从 1 开始）正好在视口中心时，需要的横向行程
  function blockCenterT(i) {
    return (i - 1) * BLOCK_GAP + BLOCK_W / 2 + vw / 2;
  }

  function jumpTo(i) {
    var y = i === 0 ? 0 : vh + blockCenterT(i);
    if (lscroll) lscroll.scrollTo(y, { duration: 1.1 });
    else window.scrollTo({ top: y, behavior: 'smooth' });
  }

  // ================= 平滑滚动：Locomotive Scroll v5 =================
  // 它自带 data-scroll / data-scroll-speed 自动视差，但那是给「随页面纵向滚过视口」的元素用的；
  // 我们的条条是钉住之后横向滑的，自动视差用不上（会算出几百 px 的纵向位移），
  // 这里吃它的 Lenis 内核：滚动带惯性，横滑跟着平滑值走。
  // 以后加普通纵向栏目时，元素上写 data-scroll data-scroll-speed="0.3" 就自动有视差。
  var lscroll = (typeof locomotiveScroll === 'function')
    ? new locomotiveScroll({
        lenisOptions: {
          lerp: 0.09,            // 平滑程度：越小越飘（0.05~0.12 之间调）
          wheelMultiplier: 1,
          smoothWheel: true,
          syncTouch: false
        },
        scrollCallback: function (l) { layout(l.scroll); }
      })
    : null;

  // ================= 顶部悬挂轮子 =================
  var wheel = OptionWheel.create(document.getElementById('wheel'), SECTIONS, {
    defaultSelected: 0,
    side: 'right',
    fontSize: 1.5,
    spacing: 1.9,
    curve: 2,
    tilt: 6,
    blur: 1.5,
    fade: 0.35,
    smoothing: 200,
    inset: 48,
    loop: true,
    draggable: false,             // 删掉拖拽：这页轮子只用来点项跳栏目（原来 pointerdown 会进拖拽态）
    dragAxis: 'x',
    captureWheel: false,          // 滚轮让给页面
    textColor: '#bdbdbd',
    activeColor: '#111111',
    onChange: function (i) { if (!syncing) jumpTo(i); }
  });

  // ================= 右上菜单 =================
  StaggeredMenu.create(document.getElementById('menu'), {
    position: 'left',
    isFixed: true,
    colors: ['#FF4D9D', '#FF0374'],
    items: SECTIONS.map(function (n, i) {        // Home + 11 个栏目，点了跳到那一栏
      return { label: n, link: i === 0 ? '#home' : '#s' + i };
    }),
    displaySocials: false,
    displayItemNumbering: true,
    menuButtonColor: '#111111',
    openMenuButtonColor: '#FF0374',
    accentColor: '#FF0374',
    changeMenuColorOnOpen: true,
    closeOnClickAway: true
  });
  // 菜单展开后那块列表本身就是个滚动容器（12 项一屏放不下），但页面滚动被 Lenis 接管了 ——
  // 不给它开这个口子的话，滚轮只会滚页面、面板纹丝不动，最后几项点不到。
  var smPanelEl = document.querySelector('.staggered-menu-panel');
  if (smPanelEl) smPanelEl.setAttribute('data-lenis-prevent', '');

  // ================= 事件 =================
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; layout(); });
  }, { passive: true });

  window.addEventListener('resize', function () {
    if (cpOpen) cpHardClose();     // 面板开着时尺寸变了就立刻收掉，免得停在半路
    lastIdx = -1;
    build();
    if (lscroll) {
      lscroll.resize();
      if (lscroll.lenisInstance) lscroll.lenisInstance.resize();
    }
  });

  // ================= 滚轮呼吸：每根条散开的幅度与快慢都不同 =================
  // 展开量 spTarget 跟着「滚动速度」走（不是跟着滚动位置），所以滚的时候散开、一停就收回原位。
  // 每根条再用自己的 spk（方向/幅度）和 ssk（跟上快慢）去追 → 滑动中条与条之间有速度差。
  function spreadTick() {
    spRAF = 0;
    var now = performance.now();
    var y = window.scrollY;
    if (spLastY === null || now - spTickT > 120) spLastY = y;   // 停久了重启，别把旧差值当速度
    var dt = now - spTickT; if (dt < 1) dt = 16;
    // 速度按 px/ms 算：window.scrollY 是整数，Lenis 尾巴里每帧只在 0/1 间跳，
    // 用「每帧差值」会把这种亚像素残速误判成高速（散开量抖着不收回）。
    var v = (y - spLastY) / dt;
    spLastY = y; spTickT = now;

    // 死区 0.1px/ms：scrollY 是整数，1px 跳变 ≈ 0.0625，那是舍入噪声不是滚动
    if (Math.abs(v) > 0.1) { spTarget = clamp(v / SP_V, -1, 1); spMoveT = now; }
    else if (now - spMoveT > 70) { spTarget = 0; }              // 滚停 → 收回

    var busy = false, i;
    for (i = 0; i < slats.length; i++) {
      var s = slats[i];
      var t = s.spk * SP_MAX * spTarget;
      var cur = spVal[i] || 0;
      var next = cur + (t - cur) * s.ssk;
      if (Math.abs(t - next) < 0.03) next = t;
      spVal[i] = next;
      s.el.style.transform = 'translate3d(' + next.toFixed(2) + 'px,0,0)';
      if (Math.abs(next) > 0.03 || Math.abs(t - next) > 0.03) busy = true;
    }
    if (busy || Math.abs(spTarget) > 0.002) spRAF = requestAnimationFrame(spreadTick);
  }
  function startSpread() { if (!spRAF) spRAF = requestAnimationFrame(spreadTick); }

  function fromHash() {
    var h = location.hash.replace('#', '');
    if (!h) return;
    if (h === 'home') return jumpTo(0);
    var m = h.match(/^s(\d+)$/);
    if (m) return jumpTo(parseInt(m[1], 10));      // #s1 … #s11 = 第几栏（1 起）
    if (h === 'black-and-white') return jumpTo(8);  // 老链接还能用
    if (h === 'tentative') return jumpTo(11);
    var n = parseFloat(h);
    if (!isNaN(n)) {
      if (lscroll) lscroll.scrollTo(n, { immediate: true });
      else window.scrollTo(0, n);
    }
  }
  window.addEventListener('hashchange', fromHash);

  // ================= 点条条 → 变纯色 → 两段式展开成全屏角色面板 =================
  var panelEl    = document.getElementById('charpanel');
  var cpPortrait = document.getElementById('cpPortrait');
  var cpImg      = document.getElementById('cpImg');
  var cpInfo     = document.getElementById('cpInfo');
  var cpNo       = document.getElementById('cpNo');
  var cpName     = document.getElementById('cpName');
  var cpDesc     = document.getElementById('cpDesc');
  var cpOpen = false, cpIdx = -1, cpTl = null, cpRect = null, cpCx = 0, cpHalf = 0;

  // 文字色不手挑：底色一写死，就按 WCAG 对比度自动选黑字 / 白字
  function lum(hex) {
    var v = [1, 3, 5].map(function (i) { return parseInt(hex.substr(i, 2), 16) / 255; })
                     .map(function (c) { return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function ctRatio(a, b) {
    var la = lum(a), lb = lum(b), hi = Math.max(la, lb), lo = Math.min(la, lb);
    return (hi + 0.05) / (lo + 0.05);
  }

  // 顶部轮子的灰字是为白底配的，压在深色面板上会糊 —— 展开时按面板底色临时换一套
  function cpWheelInk(ink) {
    var r = document.documentElement.style;
    if (!ink) { r.removeProperty('--ow-text-color'); r.removeProperty('--ow-active-color'); return; }
    var light = ink === '#111111';
    r.setProperty('--ow-text-color', light ? 'rgba(17,17,17,.35)' : 'rgba(255,255,255,.45)');
    r.setProperty('--ow-active-color', light ? '#111111' : '#ffffff');
  }

  // 面板里立绘 / 文字的位置（改 CP_* 或加 URL 参数都能换档）
  function cpGeometry() {
    cpPortrait.style.width = (CP_CX * 200) + '%';
    cpImg.style.maxHeight = (CP_H * 100) + '%';
    cpImg.style.maxWidth = (CP_PW * 100) + 'vw';
    cpInfo.style.left = (CP_TX * 100) + '%';
    cpInfo.style.width = (CP_TW * 100) + '%';
  }

  function openPanel(i) {
    var s = slats[i];
    if (cpOpen || !s) return;
    if (cpTl) { cpTl.kill(); cpTl = null; }         // 上一条（可能是收起）还没跑完就先掐掉，免得两边抢 left/top
    cpOpen = true; cpIdx = i;

    var c = s.color || (s.noColor ? '#FFFFFF' : CP_COLOR[i % CP_COLOR.length]);   // 单根指定色 > 没上色（白）> 5 色轮转
    var ink = ctRatio(c, '#ffffff') >= ctRatio(c, '#111111') ? '#ffffff' : '#111111';
    panelEl.style.background = c;
    panelEl.style.setProperty('--cp-ink', ink);
    panelEl.style.setProperty('--cp-dim', ink === '#ffffff' ? 'rgba(255,255,255,.72)' : 'rgba(17,17,17,.62)');

    var d = CP_DATA[i % CP_DATA.length];
    cpNo.textContent = d.no;
    cpName.textContent = d.name;
    cpDesc.textContent = d.desc;
    var pic = d.portrait || (d.noFallback ? '' : s.src);   // 真立绘 > 条内图顶着（noFallback 的条不顶，先空着）
    if (pic) { cpImg.src = pic; cpImg.style.visibility = 'visible'; }
    else { cpImg.removeAttribute('src'); cpImg.style.visibility = 'hidden'; }   // 条里也还没图 → 只留文字
    cpImg.alt = d.name;

    cpWheelInk(ink);
    cpRect = s.el.getBoundingClientRect();        // 条此刻在屏幕上的矩形
    cpCx = cpRect.left + cpRect.width / 2;        // 条自己的中心（横向就锚在这儿，整段动画不移位）
    cpHalf = Math.max(cpCx, vw - cpCx);           // 半宽要长到这么多才盖满整屏（条靠右 → 右半边先出屏幕，原地+等速的必然结果）
    panelEl.hidden = false;
    gsap.set(panelEl, { left: cpRect.left, top: cpRect.top, width: cpRect.width, height: cpRect.height });
    gsap.set(cpPortrait, { opacity: 0 });
    gsap.set(cpInfo.children, { opacity: 0, y: 12 });

    if (lscroll && lscroll.stop) lscroll.stop();    // 展开期间锁住页面滚动
    gsap.to([trackEl, bgEl, fgEl, wheelHangEl], { opacity: 0, duration: 0.3, overwrite: true });

    cpTl = gsap.timeline()
      // 第一段：纵向 —— 以条的中心为锚，上下两条边同时往屏幕上下边推
      .to(panelEl, { top: 0, height: vh, duration: CP_T1, ease: 'power2.out' })
      // 第二段：横向 —— 原地张开。锚点 =「条自己的中心」，半宽从 条宽/2 长到 cpHalf，
      //         左边界 = cpCx - 半宽、右边界 = cpCx + 半宽 → 两条边每帧走的距离永远相等（等速）
      .to(panelEl, { left: cpCx - cpHalf, width: cpHalf * 2, duration: CP_T2, ease: 'power3.inOut' })
      // 立刻钳回整屏（长出去的那部分本来就在屏幕外，这一步看不见），好让立绘/文字按整屏算百分比
      .set(panelEl, { left: 0, width: vw })
      // 到位后内容才淡入
      .to(cpPortrait, { opacity: 1, duration: CP_T3, ease: 'power1.out' })
      .to(cpInfo.children, { opacity: 1, y: 0, duration: CP_T3, stagger: 0.06, ease: 'power1.out' }, '-=' + CP_OV);
    window.__cpTl = cpTl;                           // 调试钩子：__cpTl.pause().time(0.45) 能定格到「纵向长满」那一刻
  }

  function closePanel(hard) {
    if (!cpOpen) return;
    cpOpen = false;
    if (cpTl) { cpTl.kill(); cpTl = null; }
    var s = slats[cpIdx];
    var r = s ? s.el.getBoundingClientRect() : cpRect;   // 滚动锁着，位置没变
    var cx = r.left + r.width / 2, half = Math.max(cx, vw - cx);   // 和展开时同一套锚点
    if (hard) {
      panelEl.hidden = true; cpIdx = -1;
      if (lscroll && lscroll.start) lscroll.start();
      gsap.set([trackEl, bgEl, fgEl, wheelHangEl], { opacity: 1 });
      cpWheelInk(null);
      return;
    }
    cpTl = gsap.timeline({
      onComplete: function () {
        panelEl.hidden = true; cpIdx = -1;
        if (lscroll && lscroll.start) lscroll.start();
        cpWheelInk(null);
        layout();
      }
    })
      .to([cpPortrait, cpInfo.children], { opacity: 0, duration: CP_C1, ease: 'none' })
      // 内容淡掉之后，把面板摊回展开时那个宽度（多出来的还在屏幕外，看不见）—— 收拢就是展开的逆过程
      .set(panelEl, { left: cx - half, width: half * 2 })
      // 以条的中心为锚，左右两条边每帧走一样远地收回条条上（等速）
      .to(panelEl, { left: r.left, width: r.width, duration: CP_C2, ease: 'power3.inOut' })
      .to(panelEl, { top: r.top, height: r.height, duration: CP_C3, ease: 'power2.in' });
    window.__cpTl = cpTl;
    // 收回到条宽那一刻，把页面其余部分淡回来（这时面板已经窄成一根条）
    gsap.to([trackEl, bgEl, fgEl, wheelHangEl], { opacity: 1, duration: 0.2, delay: CP_C1 + CP_C2, overwrite: true });
  }
  function cpHardClose() { closePanel(true); }

  panelEl.addEventListener('click', function () { closePanel(); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') closePanel();
  });

  build();
  if (lscroll) {
    lscroll.resize();
    if (lscroll.lenisInstance) lscroll.lenisInstance.resize();
  }
  fromHash();
})();
</script>
</body>
</html>
