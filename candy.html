<!doctype html>
<meta charset="utf-8">
<title>糖果标题原型</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
  #band { position: absolute; left: 0; top: 193px; width: 100%; height: 419px; background: #FF009D; }
  .ch { position: absolute; left: 0; top: 0; width: 72px; height: 72px; color: #fff;
        font-size: 72px; line-height: 72px; text-align: center; font-weight: 700;
        will-change: transform; user-select: none; }
  #hint { position: absolute; left: 20px; bottom: 16px; font-size: 11px; color: #999; letter-spacing: 1px; }
</style>
<div id="band"></div>
<div id="hint">拖字试试 · 松手会弹回竖排 · R 键重置</div>
<script src="libs/matter.min.js"></script>
<script>
var Engine = Matter.Engine, World = Matter.World, Bodies = Matter.Bodies, Body = Matter.Body;

var engine = Engine.create({ gravity: { x: 0, y: 0 } });
var world = engine.world;
var BT = 193, BB = 612, BW = window.innerWidth, SIZE = 72;

var wallOpt = { isStatic: true, friction: 0.4, restitution: 0.35 };
World.add(world, [
  Bodies.rectangle(BW / 2, BT - 25, BW + 400, 50, wallOpt),
  Bodies.rectangle(BW / 2, BB + 25, BW + 400, 50, wallOpt),
  Bodies.rectangle(-25, 400, 50, 900, wallOpt),
  Bodies.rectangle(BW + 25, 400, 50, 900, wallOpt)
]);

var chars = ['红', '紫', '法', '典'];
var home = [];
var bodies = chars.map(function (c, i) {
  var x = 150 + (i % 2 ? 10 : -5), y = 258 + i * 74;
  var b = Bodies.rectangle(x, y, SIZE, SIZE, {
    friction: 0.25, restitution: 0.45, frictionAir: 0.02, density: 0.0015
  });
  b.homeX = x; b.homeY = y;
  b.homeAngle = -24 * Math.PI / 180;   // 她给的那张图：顺时针 24° 左右
  Body.setAngle(b, b.homeAngle);
  World.add(world, b);
  var el = document.createElement('div');
  el.className = 'ch';
  el.textContent = c;
  document.body.appendChild(el);
  home.push(el);
  return b;
});

// 鼠标划过 → 轻微晃动（不拖拽），幅度很小
var lastX = null, lastY = null;
document.addEventListener('pointermove', function (e) {
  if (lastX === null) { lastX = e.clientX; lastY = e.clientY; return; }
  var vx = e.clientX - lastX, vy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  var sp = Math.min(Math.hypot(vx, vy), 40);
  if (sp < 1) return;
  bodies.forEach(function (b) {
    var d = Math.hypot(b.position.x - e.clientX, b.position.y - e.clientY);
    if (d < 260) {
      var f = 0.00006 * (1 - d / 260) * b.mass;
      Body.applyForce(b, b.position, { x: vx * f, y: vy * f });
    }
  });
});

function reset() {
  bodies.forEach(function (b) {
    Body.setPosition(b, { x: b.homeX, y: b.homeY });
    Body.setVelocity(b, { x: 0, y: 0 });
    Body.setAngularVelocity(b, 0);
    Body.setAngle(b, 0);
  });
}
window.addEventListener('keydown', function (e) { if (e.key === 'r' || e.key === 'R') reset(); });

var SPRING = 0.00006;
var ANG_SPRING = 0.00035;
var GRAV = 0;
function frame() {
  bodies.forEach(function (b) {
    var dx = b.homeX - b.position.x, dy = b.homeY - b.position.y;
    Body.applyForce(b, b.position, { x: dx * SPRING * b.mass, y: dy * SPRING * b.mass + GRAV * b.mass });
    // 角度也弹簧回位
    var da = b.homeAngle - b.angle;
    b.torque += da * ANG_SPRING * b.inertia;
    b.angularVelocity *= 0.92;
  });
  Engine.update(engine, 1000 / 60);
  bodies.forEach(function (b, i) {
    var el = home[i];
    el.style.transform = 'translate(' + (b.position.x - SIZE / 2).toFixed(2) + 'px,' +
      (b.position.y - SIZE / 2).toFixed(2) + 'px) rotate(' + b.angle.toFixed(4) + 'rad)';
  });
  requestAnimationFrame(frame);
}
frame();
</script>
