<!doctype html>
<meta charset="utf-8">
<title>糖果标题原型</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
  #band { position: absolute; left: 0; top: 193px; width: 100%; height: 419px; background: #FF009D; overflow: hidden; }
  .ch { position: absolute; left: 0; top: 0; width: 190px; height: 190px; color: #fff;
        font-size: 190px; line-height: 190px; text-align: center; font-weight: 700;
        will-change: transform; user-select: none; }
  #hint { position: absolute; left: 20px; bottom: 16px; font-size: 11px; color: #999; letter-spacing: 1px; }
</style>
<div id="band"></div>
<div id="hint">拖字试试 · 松手会弹回竖排 · R 键重置</div>
<script src="libs/matter.min.js"></script>
<script>
var Engine = Matter.Engine, World = Matter.World, Bodies = Matter.Bodies, Body = Matter.Body;

var engine = Engine.create({ gravity: { x: 0, y: 0.3 } });
var world = engine.world;
var BT = 193, BB = 612, BW = window.innerWidth, SIZE = 190;


var chars = ['红', '紫', '法', '典'];
var home = [];
var bodies = chars.map(function (c, i) {
  // 按参考图重排（2026-11-17，DeepSeek 视觉读出来的）：2×2 错位，各自角度不同、不重叠
  // 左上红 / 右上紫 / 左下法 / 右下典
  var POS = [[232, 291], [422, 291], [232, 481], [422, 481]];
  var x = POS[i][0], y = POS[i][1];
  var b = Bodies.rectangle(x, y, 176, 176, {
    friction: 0.4, restitution: 0.15, frictionAir: 0.042, density: 0.0045,
    collisionFilter: { group: 0 }
  });
  b.homeX = x; b.homeY = y;
  b.homeAngle = [40, 30, 15, 20][i] * Math.PI / 180;   // 参考图读出来的四个角度
  Body.setAngle(b, b.homeAngle);
  World.add(world, b);
  var el = document.createElement('div');
  el.className = 'ch';
  el.textContent = c;
  document.getElementById('band').appendChild(el);
  home.push(el);
  return b;
});

// 滚轮 → 像刹车一样的前摇后摇（她 2026-11-17）
// 不是给力，而是给一个「目标偏移」，字用二阶弹簧去追：追不到 → 前摇；追过头 → 后摇
var offT = 0, off = 0, offV = 0;
window.addEventListener('wheel', function (e) {
  var d = Math.max(-70, Math.min(70, e.deltaY));
  offT -= d * 0.078;          // 往滚动的反方向拖（刹车时人往前倾）
}, { passive: true });

function reset() {
  bodies.forEach(function (b) {
    Body.setPosition(b, { x: b.homeX, y: b.homeY });
    Body.setVelocity(b, { x: 0, y: 0 });
    Body.setAngularVelocity(b, 0);
    Body.setAngle(b, 0);
  });
}
window.addEventListener('keydown', function (e) { if (e.key === 'r' || e.key === 'R') reset(); });

var SPRING = 0.000025;   // 弱弹簧：重量压着它，只微微下沉
var ANG_SPRING = 0.00035;
var GRAV = 0;
var MIN_D = 130;       // 两字中心的「挤」间距：小于它就互相推（允许 30% 左右重叠）
var PUSH = 0.00016;
function frame() {
  offT *= 0.965;                        // 目标自己衰减回 0
  var acc = (offT - off) * 0.013 - offV * 0.092;
  offV += acc;
  off += offV;
  // 软碰撞：字可以压着字，但压太深会被推开 —— 真刚体碰撞会让它们彻底分开，就没有「挤」了
  for (var a = 0; a < bodies.length; a++) {
    for (var c = a + 1; c < bodies.length; c++) {
      var A = bodies[a], B = bodies[c];
      var dx = B.position.x - A.position.x, dy = B.position.y - A.position.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d < MIN_D) {
        var pf = (MIN_D - d) / MIN_D * PUSH;
        var ux = dx / d, uy = dy / d;
        Body.applyForce(A, A.position, { x: -ux * pf * A.mass, y: -uy * pf * A.mass });
        Body.applyForce(B, B.position, { x: ux * pf * B.mass, y: uy * pf * B.mass });
      }
    }
  }
  bodies.forEach(function (b) {
    var dx = b.homeX - b.position.x, dy = b.homeY - b.position.y;
    Body.applyForce(b, b.position, { x: dx * SPRING * b.mass, y: dy * SPRING * b.mass + GRAV * b.mass });
    // 角度也弹簧回位
    var da = b.homeAngle - b.angle;
    b.torque += da * ANG_SPRING * b.inertia;
    b.angularVelocity *= 0.86;
  });
  Engine.update(engine, 1000 / 60);
  bodies.forEach(function (b, i) {
    var el = home[i];
    el.style.transform = 'translate(' + (b.position.x + off - SIZE / 2).toFixed(2) + 'px,' +
      (b.position.y - 193 - SIZE / 2).toFixed(2) + 'px) rotate(' + (b.angle + off * 0.0035).toFixed(4) + 'rad)';
  });
  requestAnimationFrame(frame);
}
frame();
</script>
